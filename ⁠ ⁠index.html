<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Umbra Reign | عهد الظلال</title>
    <style>
        :root {
            --bg-color: #0b090a;
            --card-bg: #161214;
            --accent-pink: #ffb3c6;
            --text-main: #f5f3f4;
            --text-muted: #d3d2d3;
            --border-color: #2a2327;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            direction: rtl;
        }
        header {
            text-align: center;
            padding: 40px 20px;
            border-bottom: 1px solid var(--border-color);
            background: linear-gradient(to bottom, #1a1215, var(--bg-color));
        }
        h1 {
            color: var(--accent-pink);
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        .container {
            max-width: 800px;
            margin: 30px auto;
            padding: 0 20px;
        }
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h2 {
            color: var(--accent-pink);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }
        p {
            line-height: 1.8;
            color: var(--text-muted);
        }
    </style>
</head>
<body>
    <header>
        <h1>Umbra Reign</h1>
        <p>عهد الظلال - في عالم فيلمورا الأسطوري</p>
    </header>
    <div class="container">
        <div class="card">
            <h2>قصة الرواية</h2>
            <p>مرحباً بكِ في عالم روايتك الخاصة. هنا تبدأ حكاية بياتريس ولوسيان وصراع العوالم والخوارق في رحلة لا تنتهي من الإثارة والغموض.</p>
        </div>
    </div>
</body>
</html>
